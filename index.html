<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<title>ગુજરાતી રેસ ગેમ (Real Car)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin:0; display:flex; justify-content:center; align-items:center;
    min-height:100vh; background:linear-gradient(180deg,#111,#333);
    font-family:"Noto Sans Gujarati",sans-serif; color:#fff;
  }
  #gameWrap { display:flex; flex-direction:column; align-items:center; gap:12px; }

  #road {
    width:90vw; max-width:320px; height:70vh; max-height:520px;
    background:#222; position:relative; overflow:hidden;
    border:4px solid #555; border-radius:12px; box-shadow:0 0 20px #000;
  }
  #road::before, #road::after {
    content:""; position:absolute; top:0; bottom:0; width:4px;
    background:repeating-linear-gradient(to bottom,#fff8 0 20px,transparent 20px 40px);
  }
  #road::before { left:33%; }
  #road::after { left:66%; }

  /* real car image */
  #car {
    width:60px; height:100px;
    position:absolute; bottom:10px;
    background:url('https://raw.githubusercontent.com/devenramanuj/test/main/car.png') no-repeat center/contain;
  }

  .obstacle {
    width:60px; height:100px; background:linear-gradient(#f33,#a00);
    position:absolute; top:-120px; border-radius:10px; box-shadow:0 0 10px #f33;
  }
  #score {
    position:absolute; top:8px; left:8px; font-size:clamp(14px,3vw,18px);
  }
  #restartBtn {
    margin-top:8px;
    padding:8px 14px;
    background:#444; color:#fff;
    border:none; border-radius:6px;
    cursor:pointer;
    font-size:clamp(14px,3vw,18px);
  }
  #controls { display:flex; justify-content:center; gap:12px; width:100%; }
  .btn { flex:1; padding:14px; background:#444; color:#fff; border:none; border-radius:10px;
    font-size:clamp(14px,4vw,18px); cursor:pointer; }
  .btn:active { background:#666; }
</style>
</head>
<body>
<div id="gameWrap">
  <div id="road">
    <div id="car"></div>
    <div id="score">સ્કોર: 0</div>
  </div>
  <!-- restart button road div બહાર -->
  <button id="restartBtn">🔄 ફરી શરૂ</button>
  <div id="controls">
    <button class="btn" id="btnLeft">⬅️ ડાબે</button>
    <button class="btn" id="btnRight">જમણે ➡️</button>
  </div>
</div>

<!-- Sound effects -->
<audio id="soundScore" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
<audio id="soundCrash" src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"></audio>
<!-- Background music -->
<audio id="bgMusic" src="https://actions.google.com/sounds/v1/ambiences/office_busy.ogg" loop></audio>

<script>
const road=document.getElementById("road");
const car=document.getElementById("car");
const scoreEl=document.getElementById("score");
const restartBtn=document.getElementById("restartBtn");
const btnLeft=document.getElementById("btnLeft");
const btnRight=document.getElementById("btnRight");
const soundScore=document.getElementById("soundScore");
const soundCrash=document.getElementById("soundCrash");
const bgMusic=document.getElementById("bgMusic");

let lane=1,score=0,obstacles=[],running=true;
bgMusic.volume=0.3; bgMusic.play();

function setLane(n){
  lane=Math.max(0,Math.min(2,n));
  const laneWidth=road.clientWidth/3;
  car.style.left=(laneWidth*lane + laneWidth/2 - car.clientWidth/2) + "px";
}
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") setLane(lane-1);
  if(e.key==="ArrowRight") setLane(lane+1);
});
btnLeft.addEventListener("click",()=>setLane(lane-1));
btnRight.addEventListener("click",()=>setLane(lane+1));

/* ✅ Swipe control */
let touchStartX=null;
road.addEventListener("touchstart",e=>{
  touchStartX=e.touches[0].clientX;
});
road.addEventListener("touchend",e=>{
  if(touchStartX===null) return;
  let touchEndX=e.changedTouches[0].clientX;
  let diff=touchEndX-touchStartX;
  if(diff<-30){ setLane(lane-1); } // swipe left
  else if(diff>30){ setLane(lane+1); } // swipe right
  touchStartX=null;
});

function spawnObstacle(){
  const ob=document.createElement("div");
  ob.className="obstacle";
  const laneIndex=Math.floor(Math.random()*3);
  const laneWidth=road.clientWidth/3;
  ob.style.left=(laneWidth*laneIndex + laneWidth/2 - ob.clientWidth/2) + "px";
  road.appendChild(ob);
  obstacles.push(ob);
}
function update(){
  if(!running) return;
  obstacles.forEach((ob,i)=>{
    ob.style.top=(parseFloat(ob.style.top||-100)+4)+"px";
    if(parseFloat(ob.style.top)>road.clientHeight){
      ob.remove(); obstacles.splice(i,1);
      score++; scoreEl.textContent="સ્કોર: "+score;
      soundScore.play();
    }
    const carRect=car.getBoundingClientRect();
    const obRect=ob.getBoundingClientRect();
    if(!(carRect.right<obRect.left||carRect.left>obRect.right||carRect.bottom<obRect.top||carRect.top>obRect.bottom)){
      running=false; scoreEl.textContent="ગેમ ઓવર! સ્કોર: "+score;
      soundCrash.play(); bgMusic.pause();
    }
  });
}
setInterval(()=>{ if(running) spawnObstacle(); },1500);
function loop(){ update(); requestAnimationFrame(loop); }
loop();

restartBtn.addEventListener("click",()=>{
  obstacles.forEach(o=>o.remove());
  obstacles=[]; score=0; scoreEl.textContent="સ્કોર: 0";
  running=true; setLane(1);
  bgMusic.currentTime=0; bgMusic.play();
});
window.addEventListener("resize",()=>setLane(lane));
setLane(1);
</script>
</body>
</html>
