<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>બોલતું–સાંભળતું કેલ્ક્યુલેટર</title>
  <style>
    :root{
      --bg1:#0f172a; --bg2:#1f2937; --panel:#111827;
      --text:#f1f5f9; --muted:#9ca3af;
      --accent:#22c55e; --accent2:#38bdf8; --danger:#ef4444;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, Noto Sans Gujarati, sans-serif;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
    }
    .app{
      width:100%; max-width:460px; background:var(--panel);
      border-radius:20px; box-shadow:0 12px 36px rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.08); overflow:hidden;
    }
    header{
      background:rgba(255,255,255,.05); padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
    }
    header h1{margin:0; font-size:18px; letter-spacing:.2px}
    .btn{
      border:none; border-radius:10px; padding:8px 12px; font-weight:700; cursor:pointer; margin-left:8px;
      display:inline-flex; align-items:center; gap:6px;
    }
    .btn.info{background:var(--accent2); color:#062e2e}
    .btn.primary{background:var(--accent); color:#062e0f}
    .btn.danger{background:var(--danger); color:#3b0a0a}
    .display{
      padding:16px; background:rgba(255,255,255,.03); border-top:1px solid rgba(255,255,255,.06);
      display:grid; gap:10px;
    }
    .expr,.result{
      width:100%; padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,.08);
      background:#0b1220; color:var(--text); font-size:18px;
    }
    .expr::placeholder{color:#94a3b8}
    .result{font-size:22px; font-weight:800; background:#0a1628}
    .status{font-size:12px; color:var(--muted)}
    .grid{
      display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:16px;
    }
    .key{
      padding:16px; border-radius:12px; border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.06); text-align:center; font-size:18px; font-weight:800; cursor:pointer; transition:.15s;
      user-select:none;
    }
    .key:active{transform:scale(.98)}
    .key.op{background:rgba(56,189,248,.18); border-color:rgba(56,189,248,.35)}
    .key.eq{background:rgba(34,197,94,.18); border-color:rgba(34,197,94,.35)}
    .key.fn{background:rgba(239,68,68,.18); border-color:rgba(239,68,68,.35)}
    footer{
      padding:12px 16px; font-size:12px; color:var(--muted); background:rgba(255,255,255,.05);
      border-top:1px solid rgba(255,255,255,.06);
    }
    .tip{color:#9ca3af; font-size:12px}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>બોલતું–સાંભળતું કેલ્ક્યુલેટર</h1>
      <div>
        <button id="listenBtn" class="btn info">🎙️ Listen</button>
        <button id="speakToggle" class="btn primary">🔊 Speak: On</button>
        <button id="clearAll" class="btn danger">AC</button>
      </div>
    </header>

    <div class="display">
      <input id="expr" class="expr" placeholder="અહીં લખો અથવા બોલો… (e.g., 12+7*3, 100000 ના 10 ટકા લેખે 1 વર્ષ)" />
      <div id="result" class="result">Result: —</div>
      <div id="status" class="status">Speech: ready</div>
      <div class="tip">Gujarati phrases: “પાંચ વત્તા બે”, “દસ બાદબાકી ત્રણ”, “ચક્રવૃદ્ધિ વ્યાજ 2 વર્ષ”…</div>
    </div>

    <div class="grid" id="keys">
      <div class="key fn" data-k="AC">AC</div>
      <div class="key fn" data-k="DEL">⌫</div>
      <div class="key fn" data-k="(">(</div>
      <div class="key fn" data-k=")">)</div>

      <div class="key" data-k="7">7</div>
      <div class="key" data-k="8">8</div>
      <div class="key" data-k="9">9</div>
      <div class="key op" data-k="/">÷</div>

      <div class="key" data-k="4">4</div>
      <div class="key" data-k="5">5</div>
      <div class="key" data-k="6">6</div>
      <div class="key op" data-k="*">×</div>

      <div class="key" data-k="1">1</div>
      <div class="key" data-k="2">2</div>
      <div class="key" data-k="3">3</div>
      <div class="key op" data-k="-">−</div>

      <div class="key" data-k="0">0</div>
      <div class="key" data-k=".">.</div>
      <div class="key eq" data-k="=">=</div>
      <div class="key op" data-k="+">+</div>
    </div>

    <footer>
      Voice math: “100000 ના 10 ટકા લેખે 1 વર્ષ”, “100000 ના 10 ટકા ચક્રવૃદ્ધિ વ્યાજ 2 વર્ષ”, “વર્ગમૂળ 81”, “2 ઘાત 3”.
    </footer>
  </div>

<script>
  // Elements
  const exprEl = document.getElementById('expr');
  const resultEl = document.getElementById('result');
  const statusEl = document.getElementById('status');
  const listenBtn = document.getElementById('listenBtn');
  const speakToggle = document.getElementById('speakToggle');
  const clearAllBtn = document.getElementById('clearAll');
  const keys = document.getElementById('keys');

  // State
  let speakOn = true;
  let recognizing = false;

  // Safe evaluator for math-only expressions
  function safeEval(expression) {
    const allowed = /^[0-9+\-*/().\s%a-zA-Z,_]*$/;
    if (!allowed.test(expression)) throw new Error('Invalid characters');
    // Percent handling:
    // "a % b" -> "a * (b/100)"
    let exp = expression.replace(/(\d+(?:\.\d+)?)\s*%\s*(\d+(?:\.\d+)?)/g, (_, a, b) => `${a}*(${b}/100)`);
    // "x%" -> "(x/100)"
    exp = exp.replace(/(\d+(?:\.\d+)?)\s*%/g, (_, x) => `(${x}/100)`);
    // eslint-disable-next-line no-new-func
    return Function('return (' + exp + ')')();
  }

  function updateResult() {
    const exp = exprEl.value.trim();
    if (!exp) { resultEl.textContent = 'Result: —'; return; }
    try {
      const val = safeEval(exp);
      const out = Number.isFinite(val) ? val : 'Error';
      resultEl.textContent = 'Result: ' + out;
      if (speakOn && Number.isFinite(val)) speak(`પરિણામ: ${out}`);
    } catch (e) {
      resultEl.textContent = 'Result: Error';
    }
  }

  // Keyboard grid
  keys.addEventListener('click', (e) => {
    const k = e.target.dataset.k;
    if (!k) return;
    if (k === 'AC') { exprEl.value = ''; updateResult(); return; }
    if (k === 'DEL') { exprEl.value = exprEl.value.slice(0, -1); updateResult(); return; }
    if (k === '=') { updateResult(); return; }
    exprEl.value += k;
    updateResult();
  });

  clearAllBtn.addEventListener('click', () => {
    exprEl.value = '';
    updateResult();
  });

  exprEl.addEventListener('input', updateResult);

  // Speech synthesis
  function speak(text) {
    if (!window.speechSynthesis) return;
    const utter = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const guVoice = voices.find(v => /gu/i.test(v.lang));
    const enVoice = voices.find(v => /en/i.test(v.lang));
    utter.voice = guVoice || enVoice || null;
    utter.rate = 1.0;
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }

  speakToggle.addEventListener('click', () => {
    speakOn = !speakOn;
    speakToggle.textContent = speakOn ? '🔊 Speak: On' : '🔇 Speak: Off';
    if (speakOn) speak('વોઇસ ચાલુ છે');
  });

  // Speech recognition
  let SR = null;
  try {
    const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SRClass) {
      SR = new SRClass();
      SR.lang = 'gu-IN'; // prefer Gujarati; mixed Gujarati/English still parsed
      SR.interimResults = false;
      SR.maxAlternatives = 1;
    }
  } catch (e) { /* ignore */ }

  function normalizeVoiceMath(text) {
    let t = (text || '').toLowerCase().trim();

    // Gujarati digits ૦-૯ → 0-9
    const guDigits = { '૦':'0','૧':'1','૨':'2','૩':'3','૪':'4','૫':'5','૬':'6','૭':'7','૮':'8','૯':'9' };
    t = t.replace(/[૦-૯]/g, d => guDigits[d] || d);

    // Remove filler words
    t = t.replace(/\b(of|by|and)\b|નો|ની|ના|ને|થી|માં|પર|નું|ના|ની/g, ' ');

    // Operators (Gujarati + English)
    t = t
      .replace(/વત્તા|ઉમેરો|જોડો|પ્લસ|plus/g, '+')
      .replace(/બાદબાકી|ઘટાડો|ઓછા|કમ|minus/g, '-')
      .replace(/ગુણાકાર|ગુણો|ઇન્ટુ|ઇન્ટો|times|multiply|into/g, '*')
      .replace(/ભાગાકાર|ભાગો|થી ભાગો|divide|divided by/g, '/')
      .replace(/ટકાવારી|ટકા|percent/g, '%')
      .replace(/વર્ગમૂળ|square root of/g, 'sqrt ')
      .replace(/ઘાત|power of|to the power/g, '^');

    // Gujarati numbers (basic words)
    const guNums = {
      'શૂન્ય':'0','એક':'1','બે':'2','ત્રણ':'3','ચાર':'4','પાંચ':'5','છ':'6','સાત':'7','આઠ':'8','નવ':'9','દસ':'10',
      'અગિયાર':'11','બાર':'12','તેર':'13','ચૌદ':'14','પંદર':'15','સોળ':'16','સત્તર':'17','અઢાર':'18','ઓગણીસ':'19',
      'વીસ':'20','ત્રીસ':'30','ચાળીસ':'40','પચાસ':'50','સાઠ':'60','સિત્તેર':'70','એંસી':'80','નેવ્વે':'90','સો':'100'
    };
    Object.entries(guNums).forEach(([w,n]) => {
      t = t.replace(new RegExp(`\\b${w}\\b`, 'g'), n);
    });

    // English numbers (basic)
    const enNums = {
      zero:'0', one:'1', two:'2', three:'3', four:'4', five:'5', six:'6', seven:'7', eight:'8', nine:'9', ten:'10',
      eleven:'11', twelve:'12', thirteen:'13', fourteen:'14', fifteen:'15', sixteen:'16', seventeen:'17', eighteen:'18', nineteen:'19',
      twenty:'20', thirty:'30', forty:'40', fifty:'50', sixty:'60', seventy:'70', eighty:'80', ninety:'90', hundred:'100'
    };
    Object.entries(enNums).forEach(([w,n]) => {
      t = t.replace(new RegExp(`\\b${w}\\b`, 'g'), n);
    });

    // Square root: "sqrt 81" → "Math.sqrt(81)"
    t = t.replace(/sqrt\s+(\d+(?:\.\d+)?)/g, (_, num) => `Math.sqrt(${num})`);

    // Power: "2 ^ 3" → "Math.pow(2,3)"
    t = t.replace(/(\d+(?:\.\d+)?)\s*\^\s*(\d+(?:\.\d+)?)/g, (_, a, b) => `Math.pow(${a},${b})`);

    // Percent phrase: "x ટકા y" → "x % y"
    t = t.replace(/(\d+(?:\.\d+)?)\s*(ટકા|percent)\s*(\d+(?:\.\d+)?)/g, (_, a, _p, b) => `${a} % ${b}`);

    // Finance terms
    t = t.replace(/વ્યાજ/g, ''); // ignore word "interest"
    t = t.replace(/લેખે|lekhe|leke/g, '*'); // treat as multiplication
    t = t.replace(/દર/g, '*'); // rate → multiply
    // Years: keep number; if "X વર્ષ", multiply by X later via regex
    // Simple interest: "P ના R ટકા લેખે Y વર્ષ" → P*(R/100)*Y
    t = t.replace(/(\d+)\s*ના\s*(\d+)\s*ટકા\s*લેખે\s*(\d+)\s*વર્ષ/g,
      (_, principal, rate, years) => `${principal}*(${rate}/100)*${years}`
    );
    // Simple interest without years: assume just P*(R/100)
    t = t.replace(/(\d+)\s*ના\s*(\d+)\s*ટકા\s*લેખે/g,
      (_, principal, rate) => `${principal}*(${rate}/100)`
    );

    // Compound interest phrases
    t = t.replace(/ચક્રવૃદ્ધિ વ્યાજ|compound interest/g, 'CI');
    // "P ના R ટકા CI Y વર્ષ" → (P*Math.pow(1+R/100, Y) - P)
    t = t.replace(/(\d+)\s*ના\s*(\d+)\s*ટકા\s*CI\s*(\d+)\s*વર્ષ/g,
      (_, principal, rate, years) => `(${principal}*Math.pow((1+${rate}/100),${years})-${principal})`
    );
    // Without years: default 1 year
    t = t.replace(/(\d+)\s*ના\s*(\d+)\s*ટકા\s*CI/g,
      (_, principal, rate) => `(${principal}*Math.pow((1+${rate}/100),1)-${principal})`
    );

    // Keep only safe characters
    t = t.replace(/[^0-9+\-*/().\s%a-zA-Z,_]/g, ' ');
    // Collapse spaces
    t = t.replace(/\s+/g, ' ').trim();

    return t;
  }

  function startListening() {
    if (!SR) {
      statusEl.textContent = 'Speech: not supported on this browser';
      return;
    }
    if (recognizing) return;
    recognizing = true;
    statusEl.textContent = 'Listening… બોલો: “પાંચ વત્તા બે”, “100000 ના 10 ટકા લેખે 1 વર્ષ”';
    SR.start();
  }

  listenBtn.addEventListener('click', () => {
    if (!SR) { statusEl.textContent = 'Speech: not supported'; return; }
    if (recognizing) {
      SR.stop();
      recognizing = false;
      statusEl.textContent = 'Speech: stopped';
    } else {
      startListening();
    }
  });

  if (SR) {
    SR.onresult = (event) => {
      const text = event.results[0][0].transcript;
      statusEl.textContent = 'Heard: ' + text;
      const normalized = normalizeVoiceMath(text);
      if (normalized) {
        exprEl.value = normalized;
        updateResult();
      }
    };
    SR.onend = () => {
      recognizing = false;
      statusEl.textContent = 'Speech: ready';
    };
    SR.onerror = (e) => {
      recognizing = false;
      statusEl.textContent = 'Speech error: ' + (e.error || 'unknown');
    };
  }

  // Initial speak
  setTimeout(() => speak('કેલ્ક્યુલેટર તૈયાર છે'), 400);
</script>
</body>
</html>
